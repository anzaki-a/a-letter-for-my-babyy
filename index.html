<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>A Letter For U 💌</title>


    <style>

        /* =========================================
           RESET
        ========================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* =========================================
           BODY
        ========================================= */

        body {

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                radial-gradient(
                    circle at center,
                    #fff4f6 0%,
                    #f8e6eb 55%,
                    #f2dce2 100%
                );

            font-family:
                "Trebuchet MS",
                Arial,
                sans-serif;

            overflow: hidden;

            color: #59494d;
        }


        /* =========================================
           CONTAINER
        ========================================= */

        .container {

            position: relative;

            width: 100%;
            max-width: 500px;

            height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;
        }


        /* =========================================
           HIDDEN CHECKBOX
        ========================================= */

        #open,
        #read {

            display: none;
        }


        /* =========================================
           TITLE
        ========================================= */

        .title {

            position: absolute;

            top: 15%;

            width: 100%;

            text-align: center;

            font-family: Georgia, serif;

            font-size: 30px;

            letter-spacing: 1px;

            color: #a75d69;

            transition:
                opacity 0.7s ease,
                transform 0.7s ease;
        }


        /* =========================================
           INSTRUCTION
        ========================================= */

        .instruction {

            position: absolute;

            bottom: 18%;

            width: 100%;

            text-align: center;

            font-size: 14px;

            color: #a75d69;

            transition:
                opacity 0.6s ease;
        }


        /* =========================================
           ENVELOPE AREA
        ========================================= */

        .envelope-area {

            position: relative;

            width: 370px;

            height: 280px;
        }


        /* =========================================
           ENVELOPE
        ========================================= */

        .envelope {

            position: absolute;

            width: 350px;

            height: 225px;

            left: 50%;

            top: 50%;

            transform:
                translate(-50%, -50%);

            cursor: pointer;
        }


        /* =========================================
           LETTER
        ========================================= */

        .letter {

            position: absolute;

            width: 310px;

            height: 250px;

            left: 20px;

            top: 15px;

            padding: 30px 25px;

            background: #fffdf8;

            border-radius: 4px;

            box-shadow:
                0 8px 25px
                rgba(80, 40, 50, 0.16);

            overflow: hidden;

            cursor: pointer;

            /*
                IMPORTANT:

                Surat benar-benar berada
                DI BELAKANG badan amplop
                pada tahap pertama.
            */

            z-index: 1;

            transition:
                top 1s ease,
                left 1s ease,
                width 1s ease,
                height 1s ease,
                transform 1s ease,
                opacity 0.7s ease;
        }


        /* =========================================
           LETTER CONTENT
        ========================================= */

        .letter-content {

            opacity: 0;

            transition:
                opacity 0.8s ease 0.6s;
        }


        .letter h2 {

            text-align: center;

            font-family: Georgia, serif;

            color: #b45f69;

            font-size: 25px;

            margin-bottom: 22px;
        }


        .letter p {

            font-size: 14px;

            line-height: 1.8;

            margin-bottom: 14px;

            color: #5b5153;
        }


        .signature {

            margin-top: 30px;

            text-align: right;

            font-family: Georgia, serif;

            font-style: italic;

            color: #a75d69;
        }


        /* =========================================
           ENVELOPE BODY
        ========================================= */

        .envelope-body {

            position: absolute;

            width: 350px;

            height: 225px;

            left: 0;

            top: 0;

            background: #d98a92;

            border-radius: 6px;

            box-shadow:
                0 15px 35px
                rgba(100, 50, 65, 0.2);

            z-index: 3;

            transition:
                opacity 0.7s ease;
        }


        /* =========================================
           FRONT FOLD
        ========================================= */

        .envelope-body::after {

            content: "";

            position: absolute;

            left: 0;

            bottom: 0;

            width: 0;

            height: 0;

            border-left:
                175px solid transparent;

            border-right:
                175px solid transparent;

            border-bottom:
                125px solid #c9757e;

            z-index: 4;
        }


        /* =========================================
           ENVELOPE FLAP
        ========================================= */

        .flap {

            position: absolute;

            left: 0;

            top: 0;

            width: 0;

            height: 0;

            border-left:
                175px solid transparent;

            border-right:
                175px solid transparent;

            border-top:
                125px solid #e49ba2;

            transform-origin:
                top center;

            z-index: 5;

            transition:
                transform 0.9s ease;
        }


        /* =========================================
           BALLOONS
        ========================================= */

        .balloons {

            position: fixed;

            inset: 0;

            pointer-events: none;

            opacity: 0;

            transition:
                opacity 0.8s ease;
        }


        .balloon {

            position: absolute;

            bottom: -100px;

            width: 38px;

            height: 48px;

            border-radius:
                50% 50% 45% 45%;

            animation:
                balloonFly 7s linear infinite;
        }


        .balloon::before {

            content: "";

            position: absolute;

            bottom: -6px;

            left: 50%;

            transform:
                translateX(-50%);

            border-left:
                5px solid transparent;

            border-right:
                5px solid transparent;

            border-top:
                8px solid currentColor;
        }


        .balloon::after {

            content: "";

            position: absolute;

            width: 1px;

            height: 100px;

            left: 50%;

            top: 46px;

            background:
                rgba(80, 60, 60, 0.3);
        }


        .balloon:nth-child(1) {

            left: 8%;

            background: #e7a1aa;

            animation-delay: 0s;
        }


        .balloon:nth-child(2) {

            left: 25%;

            background: #e8c27e;

            animation-delay: 1.5s;
        }


        .balloon:nth-child(3) {

            left: 48%;

            background: #9fc5d8;

            animation-delay: 0.7s;
        }


        .balloon:nth-child(4) {

            left: 70%;

            background: #c3a3d6;

            animation-delay: 2s;
        }


        .balloon:nth-child(5) {

            left: 87%;

            background: #e2a1a5;

            animation-delay: 3s;
        }


        /* =========================================
           BALLOON ANIMATION
        ========================================= */

        @keyframes balloonFly {

            0% {

                transform:
                    translateY(0)
                    rotate(-5deg);

                opacity: 0;
            }

            10% {

                opacity: 1;
            }

            50% {

                transform:
                    translateY(-400px)
                    rotate(7deg);
            }

            100% {

                transform:
                    translateY(-900px)
                    rotate(-8deg);

                opacity: 0;
            }
        }


        /* =========================================
           ================= STAGE 2 ================
        ========================================= */


        /*
            Flap terbuka
        */

        #open:checked
        ~ .envelope-area
        .flap {

            transform:
                rotateX(180deg);

            z-index: 1;
        }


        /*
            Surat baru keluar sedikit.

            Karena envelope-body masih
            berada di atasnya, bagian
            bawah surat tetap tertutup.
        */

        #open:checked
        ~ .envelope-area
        .letter {

            top: -45px;

            z-index: 2;
        }


        /*
            Balon mulai muncul
        */

        #open:checked
        ~ .balloons {

            opacity: 1;
        }


        /*
            Judul sedikit menghilang
        */

        #open:checked
        ~ .title {

            transform:
                translateY(-15px);

            opacity: 0.65;
        }


        /*
            Ganti teks instruksi
        */

        #open:checked
        ~ .instruction {

            font-size: 0;

            opacity: 1;
        }


        #open:checked
        ~ .instruction::after {

            content:
                "tap the envelope to read my letter :3";

            font-size: 14px;
        }


        /* =========================================
           ================= STAGE 3 ================
        ========================================= */


        /*
            Surat keluar sepenuhnya.
        */

        #open:checked
        ~ #read:checked
        ~ .envelope-area
        .letter {

            position: fixed;

            width: min(520px, 88vw);

            height: 75vh;

            left: 50%;

            top: 50%;

            transform:
                translate(-50%, -50%);

            padding:
                45px 40px;

            overflow-y: auto;

            z-index: 20;

            opacity: 1;
        }


        /*
            Isi surat baru muncul
            setelah surat berada
            di posisi terakhir.
        */

        #open:checked
        ~ #read:checked
        ~ .envelope-area
        .letter-content {

            opacity: 1;
        }


        /*
            HILANGKAN AMPLOP
        */

        #open:checked
        ~ #read:checked
        ~ .envelope-area
        .envelope-body {

            opacity: 0;

            pointer-events: none;
        }


        #open:checked
        ~ #read:checked
        ~ .envelope-area
        .flap {

            opacity: 0;

            pointer-events: none;
        }


        /*
            Instruksi hilang
        */

        #open:checked
        ~ #read:checked
        ~ .instruction {

            opacity: 0;
        }


        /*
            Judul hilang
        */

        #open:checked
        ~ #read:checked
        ~ .title {

            opacity: 0;
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 500px) {

            .envelope-area {

                transform:
                    scale(0.85);
            }


            .title {

                font-size: 25px;
            }


            #open:checked
            ~ #read:checked
            ~ .envelope-area
            .letter {

                width: 88vw;

                height: 78vh;

                padding:
                    35px 25px;
            }
        }

    </style>

</head>


<body>


    <div class="container">


        <!-- =====================================
             CONTROL STAGE
        ====================================== -->

        <input
            type="checkbox"
            id="open"
        >

        <input
            type="checkbox"
            id="read"
        >


        <!-- =====================================
             TITLE
        ====================================== -->

        <div class="title">
            a letter for u
        </div>


        <!-- =====================================
             BALLOONS
        ====================================== -->

        <div class="balloons">

            <div class="balloon"></div>
            <div class="balloon"></div>
            <div class="balloon"></div>
            <div class="balloon"></div>
            <div class="balloon"></div>

        </div>


        <!-- =====================================
             ENVELOPE
        ====================================== -->

        <div class="envelope-area">


            <!--
                LABEL OPEN

                Klik pertama membuka amplop.
            -->

            <label
                for="open"
                class="envelope"
            >


                <!-- =================================
                     LETTER

                     Klik surat pada tahap 2
                     untuk masuk tahap 3.
                ================================== -->

                <label
                    for="read"
                    class="letter"
                >

                    <div class="letter-content">


                        <!-- =========================
                             ISI SURAT
                        ========================== -->

                        <h2>
                            Happy Birthday 🎂
                        </h2>


                        <p>
                            Dear kamu,
                        </p>


                        <p>
                            Selamat ulang tahun! 🎉
                        </p>


                        <p>
                            Hari ini adalah hari spesialmu,
                            dan aku ingin menyempatkan sedikit
                            waktu untuk menuliskan sesuatu
                            untukmu.
                        </p>


                        <p>
                            Semoga di umur yang baru ini,
                            kamu menemukan lebih banyak
                            hal yang membuatmu bahagia.
                        </p>


                        <p>
                            Semoga setiap langkah yang kamu
                            ambil membawa kamu lebih dekat
                            dengan hal-hal yang kamu impikan.
                        </p>


                        <p>
                            Jangan lupa untuk menikmati
                            perjalananmu dan menghargai
                            setiap hal kecil yang terjadi
                            dalam hidupmu.
                        </p>


                        <p>
                            Terima kasih sudah menjadi
                            seseorang yang begitu berarti.
                        </p>


                        <p>
                            Sekali lagi, selamat ulang tahun.
                            Semoga hari ini menjadi salah satu
                            hari yang selalu kamu ingat. ❤️
                        </p>


                        <p class="signature">

                            With love,<br>

                            Someone who cares about you 💌

                        </p>


                    </div>

                </label>


                <!-- =================================
                     FLAP
                ================================== -->

                <div class="flap"></div>


                <!-- =================================
                     ENVELOPE BODY
                ================================== -->

                <div class="envelope-body"></div>


            </label>

        </div>


        <!-- =====================================
             INSTRUCTION
        ====================================== -->

        <div class="instruction">

            tap the envelope to open it :3

        </div>


    </div>

</body>

</html>
